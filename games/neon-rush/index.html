<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Rush | ZUNO</title><style>*{box-sizing:border-box}body{margin:0;background:#080817;color:#fff;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(100%,850px);padding:12px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.logo{font-weight:1000;letter-spacing:2px;color:#ff66d4}.hud{display:flex;gap:8px}.hud b{background:#1b1c3b;border:1px solid #424276;border-radius:10px;padding:8px 12px}canvas{width:100%;height:auto;display:block;border-radius:18px;border:1px solid #424276;touch-action:none;background:#0a1027}.hint{text-align:center;color:#aeb3d8;font-size:12px;margin:10px}.buttons{display:flex;justify-content:center;gap:12px}.buttons button,.start{border:0;border-radius:12px;padding:12px 25px;background:linear-gradient(90deg,#ff4bbd,#7c6cff);color:white;font-weight:900;font-size:15px}.overlay{position:fixed;inset:0;background:#050514d9;display:grid;place-items:center;padding:20px}.panel{max-width:400px;background:#191a39;border:1px solid #55558b;border-radius:22px;padding:28px;text-align:center}.panel h1{font-size:38px;margin:0;color:#ff70d0}.panel p{color:#c4c6e5;line-height:1.5}.hide{display:none}</style></head><body><main class="wrap"><div class="head"><div class="logo">ZUNO · NEON RUSH</div><div class="hud"><b>🏆 <span id="score">0</span></b><b>💎 <span id="gems">0</span></b></div></div><canvas id="c" width="800" height="520"></canvas><p class="hint">← → or A / D to switch lanes · Swipe or tap left/right on mobile</p><div class="buttons"><button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button></div></main><div class="overlay" id="ov"><div class="panel"><h1>NEON RUSH</h1><p>Race through a glowing cyber city. Dodge barriers, collect gems and beat your high score!</p><button class="start" id="go">START RACING</button></div></div><script>(()=>{let c=document.querySelector('#c'),x=c.getContext('2d'),score=0,gems=0,alive=false,t=0,lane=1,obs=[],coins=[],speed=4;const lanes=[245,400,555];function start(){score=0;gems=0;t=0;lane=1;obs=[];coins=[];speed=4;alive=true;document.querySelector('#ov').classList.add('hide')}function change(d){lane=Math.max(0,Math.min(2,lane+d))}onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')change(-1);if(e.key==='ArrowRight'||e.key==='d')change(1)};document.querySelector('#left').onclick=()=>change(-1);document.querySelector('#right').onclick=()=>change(1);c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect();change(e.clientX<r.left+r.width/2?-1:1)});document.querySelector('#go').onclick=start;function draw(){let g=x.createLinearGradient(0,0,0,520);g.addColorStop(0,'#101337');g.addColorStop(1,'#08091b');x.fillStyle=g;x.fillRect(0,0,800,520);for(let i=0;i<35;i++){let sx=(i*97)%800,sy=(i*53+t*1.4)%520;x.fillStyle='#a3b8ff88';x.fillRect(sx,sy,2,2)}x.fillStyle='#181c43';x.beginPath();x.moveTo(175,0);x.lineTo(625,0);x.lineTo(760,520);x.lineTo(40,520);x.fill();x.strokeStyle='#5459a0';x.lineWidth=3;for(let lx of [320,480]){x.beginPath();x.moveTo(400+(lx-400)*.15,0);x.lineTo(lx,520);x.stroke()}for(let i=0;i<12;i++){let yy=(i*65+t*3)%600;x.fillStyle='#34386b';x.fillRect(190,yy,420,3)}obs.forEach(o=>{x.shadowBlur=18;x.shadowColor='#ff477e';x.fillStyle='#ff477e';x.beginPath();x.roundRect(lanes[o.l]-43,o.y,86,44,10);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font='bold 13px system-ui';x.textAlign='center';x.fillText('DODGE',lanes[o.l],o.y+27)});coins.forEach(o=>{x.shadowBlur=18;x.shadowColor='#55f7ff';x.fillStyle='#55f7ff';x.beginPath();x.arc(lanes[o.l],o.y,13,0,7);x.fill();x.fillStyle='#fff';x.fillRect(lanes[o.l]-2,o.y-8,4,16)});x.shadowBlur=25;x.shadowColor='#ff65d2';x.fillStyle='#ff65d2';x.beginPath();x.moveTo(lanes[lane],405);x.lineTo(lanes[lane]-34,475);x.lineTo(lanes[lane]+34,475);x.closePath();x.fill();x.fillStyle='#fff';x.fillRect(lanes[lane]-5,437,10,25);x.shadowBlur=0}
function loop(){if(alive){t++;score++;speed=Math.min(10,4+score/900);if(t%65===0)obs.push({l:Math.floor(Math.random()*3),y:-50});if(t%48===0)coins.push({l:Math.floor(Math.random()*3),y:-20});obs.forEach(o=>o.y+=speed*1.8);coins.forEach(o=>o.y+=speed*1.7);obs=obs.filter(o=>{if(o.y>405&&o.y<480&&o.l===lane){alive=false;document.querySelector('#ov').classList.remove('hide');document.querySelector('#ov h1').textContent='CRASH!';document.querySelector('#ov p').textContent='Score '+score+' · Gems '+gems+'. Try another run!';document.querySelector('#go').textContent='RACE AGAIN'}return o.y<550});coins=coins.filter(o=>{if(o.y>420&&o.y<480&&o.l===lane){gems++;return false}return o.y<550});document.querySelector('#score').textContent=score;document.querySelector('#gems').textContent=gems}draw();requestAnimationFrame(loop)}loop()})();</script></body></html>
