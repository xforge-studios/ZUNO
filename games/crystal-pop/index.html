<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Crystal Pop | ZUNO</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#27356b,#090d22 70%);color:white;font:15px system-ui}.wrap{width:min(100%,560px);padding:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-weight:1000;letter-spacing:2px;color:#8ef7ff}.score{background:#1b2850;border:1px solid #3b568c;padding:9px 13px;border-radius:12px;font-weight:900}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:10px;border-radius:18px;background:#121b3c;border:1px solid #41538a;box-shadow:0 20px 70px #0008;touch-action:manipulation}.tile{aspect-ratio:1;border:0;border-radius:12px;font-size:clamp(19px,5vw,32px);background:linear-gradient(145deg,#283c70,#19284e);box-shadow:inset 0 2px 8px #ffffff22,0 3px 5px #0004;cursor:pointer;transition:transform .12s}.tile.sel{outline:3px solid #fff;transform:scale(1.08)}.tile:active{transform:scale(.92)}.info{display:flex;justify-content:space-between;color:#bdc9ed;margin:12px 2px;font-size:13px}.buttons{display:flex;gap:8px}.buttons button{flex:1;border:0;border-radius:12px;padding:12px;background:#273d70;color:white;font-weight:900}.tip{text-align:center;color:#a9b9e1;font-size:12px;margin-top:12px}.overlay{position:fixed;inset:0;background:#070b1ddd;display:grid;place-items:center;padding:20px}.panel{max-width:390px;background:#17254a;border:1px solid #5066a2;border-radius:22px;padding:28px;text-align:center}.panel h1{font-size:36px;color:#8ef7ff;margin:0}.panel p{color:#c5d1ee;line-height:1.5}.panel button{border:0;border-radius:12px;padding:13px 25px;background:linear-gradient(90deg,#31d9e8,#947aff);font-weight:1000}.hide{display:none}</style></head><body><main class="wrap"><div class="head"><div class="logo">ZUNO · CRYSTAL POP</div><div class="score">✨ <span id="score">0</span></div></div><div class="info"><span>Moves: <b id="moves">25</b></span><span>Target: <b>1200</b></span><span>Best: <b id="best">0</b></span></div><div class="board" id="board"></div><div class="info"><span>Tap two adjacent crystals to swap.</span><span id="msg">Make combos!</span></div><div class="buttons"><button id="restart">↻ RESTART</button><button id="hint">💡 HINT</button></div><p class="tip">Match 3 or more same crystals in a row or column. Longer combos score bonus points!</p></main><div class="overlay" id="ov"><div class="panel"><h1>CRYSTAL POP</h1><p>Swap glowing gems, make matches and reach the target before your moves run out.</p><button id="play">PLAY NOW</button></div></div><script>(()=>{const N=8,icons=['💎','🔮','🟣','💠','⭐','🟢'],b=document.querySelector('#board');let a=[],sel=-1,score=0,moves=25,best=+(localStorage.crystalBest||0);document.querySelector('#best').textContent=best;function rand(){return Math.floor(Math.random()*N)}function fresh(){a=Array.from({length:N*N},()=>rand());for(let i=0;i<5;i++)clearMatches(false);score=0;moves=25;sel=-1;update()}function update(){b.innerHTML=a.map((v,i)=>`<button class="tile ${sel===i?'sel':''}" data-i="${i}">${icons[v]}</button>`).join('');b.querySelectorAll('button').forEach(q=>q.onclick=()=>tap(+q.dataset.i));document.querySelector('#score').textContent=score;document.querySelector('#moves').textContent=moves;document.querySelector('#best').textContent=best}function matches(){let s=new Set();for(let r=0;r<N;r++)for(let c=0;c<N;c++){let i=r*N+c;if(c< N-2&&a[i]===a[i+1]&&a[i]===a[i+2]){let k=c;while(k<N&&a[r*N+k]===a[i])s.add(r*N+k++)}if(r<N-2&&a[i]===a[i+N]&&a[i]===a[i+2*N]){let k=r;while(k<N&&a[k*N+c]===a[i])s.add(k++*N+c)}}return [...s]}function clearMatches(give=true){let m=matches();if(!m.length)return false;if(give)score+=m.length*10+(m.length>=4?100:0);m.forEach(i=>a[i]=-1);for(let c=0;c<N;c++){let vals=[];for(let r=N-1;r>=0;r--)if(a[r*N+c]!==-1)vals.push(a[r*N+c]);for(let r=N-1;r>=0;r--)a[r*N+c]=vals[N-1-r]??rand()}return true}function settle(){let n=0;while(clearMatches(true)&&n++<20){}if(score>best){best=score;localStorage.crystalBest=best}update();if(score>=1200||moves<=0){document.querySelector('#msg').textContent=score>=1200?'Target reached! 🎉':'Game over — try again!';setTimeout(()=>{document.querySelector('#ov').classList.remove('hide');document.querySelector('#ov h1').textContent=score>=1200?'YOU WIN!':'NICE TRY!';document.querySelector('#ov p').textContent='Final score: '+score+'. Play another round?';},450)}}function tap(i){if(sel<0){sel=i;update();return}let r=Math.floor(sel/N),c=sel%N,rr=Math.floor(i/N),cc=i%N;if(Math.abs(r-rr)+Math.abs(c-cc)!==1){sel=i;update();return}let t=a[i];a[i]=a[sel];a[sel]=t;let m=matches();if(m.length){moves--;sel=-1;settle()}else{t=a[i];a[i]=a[sel];a[sel]=t;sel=i;update();document.querySelector('#msg').textContent='No match — choose another swap'}}document.querySelector('#play').onclick=()=>{fresh();document.querySelector('#ov').classList.add('hide');document.querySelector('#ov h1').textContent='CRYSTAL POP'};document.querySelector('#restart').onclick=fresh;document.querySelector('#hint').onclick=()=>{for(let i=0;i<N*N;i++){let r=Math.floor(i/N),c=i%N;for(let j of [i+1,i+N])if((j<N*N)&&(j===i+1?c<N-1:true)){let t=a[i];a[i]=a[j];a[j]=t;if(matches().length){sel=i;update();document.querySelector('#msg').textContent='Try swapping the highlighted crystal';t=a[i];a[i]=a[j];a[j]=t;return}t=a[i];a[i]=a[j];a[j]=t}}document.querySelector('#msg').textContent='No hint found — shuffle!'};fresh();})();</script></body></html>
